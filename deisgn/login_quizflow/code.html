<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuizFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#00714d",
                        "on-error-container": "#93000a",
                        "outline": "#777587",
                        "on-surface-variant": "#464555",
                        "surface-tint": "#4d44e3",
                        "tertiary-fixed": "#ffdbcc",
                        "on-background": "#0b1c30",
                        "on-tertiary-fixed": "#351000",
                        "secondary-fixed-dim": "#4edea3",
                        "primary": "#3525cd",
                        "secondary-fixed": "#6ffbbe",
                        "tertiary-container": "#a44100",
                        "on-tertiary-container": "#ffd2be",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#c3c0ff",
                        "tertiary": "#7e3000",
                        "outline-variant": "#c7c4d8",
                        "inverse-on-surface": "#eaf1ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#002113",
                        "on-surface": "#0b1c30",
                        "inverse-surface": "#213145",
                        "secondary-container": "#6cf8bb",
                        "surface-bright": "#f8f9ff",
                        "inverse-primary": "#c3c0ff",
                        "surface-container": "#e5eeff",
                        "secondary": "#006c49",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-container-low": "#eff4ff",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "tertiary-fixed-dim": "#ffb695",
                        "surface-variant": "#d3e4fe",
                        "on-primary-fixed": "#0f0069",
                        "background": "#f8f9ff",
                        "primary-fixed": "#e2dfff",
                        "primary-container": "#4f46e5",
                        "on-error": "#ffffff",
                        "on-primary-container": "#dad7ff",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-dim": "#cbdbf5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "16px",
                        "margin-desktop": "32px",
                        "xs": "8px",
                        "lg": "40px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "base": "4px",
                        "xl": "64px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[480px]">
<div class="text-center mb-8">
<h1 class="text-headline-lg font-headline-lg text-on-background mb-2">QuizFlow</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Institute Management System</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.03)] p-8 border border-outline-variant/30">
<h2 class="text-headline-md font-headline-md text-on-surface mb-6 text-center">Welcome Back</h2>
<!-- Role Toggle -->
<div class="flex bg-surface-container-low rounded-lg p-1 mb-8" role="group">
<button class="flex-1 py-2 px-4 rounded-md bg-surface-container-lowest text-primary text-label-md font-label-md shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-low" id="tab-student" onclick="toggleRole('student')">
                    Student
                </button>
<button class="flex-1 py-2 px-4 rounded-md text-on-surface-variant text-label-md font-label-md transition-all hover:text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-low" id="tab-admin" onclick="toggleRole('admin')">
                    Admin
                </button>
</div>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-body-lg" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface bg-surface-container-lowest placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="email" name="email" placeholder="you@institute.edu" required="" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-body-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface bg-surface-container-lowest placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-sm font-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-label-md font-label-md text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors mt-8" type="submit">
                    Sign In
                </button>
</form>
</div>
<div class="mt-8 text-center text-body-sm font-body-sm text-on-surface-variant">
<p>Don't have an account? <a class="text-primary font-medium hover:underline" href="#">Contact your administrator</a></p>
</div>
</div>
<script>
        function toggleRole(role) {
            const studentBtn = document.getElementById('tab-student');
            const adminBtn = document.getElementById('tab-admin');
            
            const activeClasses = ['bg-surface-container-lowest', 'text-primary', 'shadow-sm'];
            const inactiveClasses = ['text-on-surface-variant', 'hover:text-on-surface'];

            if (role === 'student') {
                studentBtn.classList.add(...activeClasses);
                studentBtn.classList.remove(...inactiveClasses);
                
                adminBtn.classList.remove(...activeClasses);
                adminBtn.classList.add(...inactiveClasses);
            } else {
                adminBtn.classList.add(...activeClasses);
                adminBtn.classList.remove(...inactiveClasses);
                
                studentBtn.classList.remove(...activeClasses);
                studentBtn.classList.add(...inactiveClasses);
            }
        }
    </script>
</body></html>
